[package]
name = "pg_extshield"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Security, ABI drift, and cloud-readiness auditor for PostgreSQL extensions (CLI + MCP server)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
goblin = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.7.0", features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

